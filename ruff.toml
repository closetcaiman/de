# 1. CRITICAL: Add this to ensure Ruff scans notebooks
extend-include = ["*.ipynb"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", 
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", 
    ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", 
    ".tox", ".venv", ".vscode", "__pypackages__", "_build", 
    "buck-out", "build", "dist", "node_modules", "site-packages", "venv",
]

line-length = 88
indent-width = 4
target-version = "py312"

[lint]
# Added 'N' (pep8-naming) and 'UP' (pyupgrade) for better notebook code
select = ["E4", "E7", "E9", "F", "I", "N", "UP"]
# D100: Missing docstring in public module (Annoying in notebooks)
# E501: Line length (Notebooks often have long data URLs/paths)
ignore = ["D100", "D203", "D212", "E501"]

fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"**/*.ipynb" = [
    "E402", # imports mid-cell are normal in notebooks
    "N806", # uppercase X for feature matrices is sklearn convention
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true # Turned this on since you have 'D' linting enabled